name: kmmf_msrs_official
seed: 42

model:
  in_channels: 1
  base_channels: 24
  encoder_depths: [1, 2]
  decoder_depth: 2
  mamba_backend: official
  mamba_d_state: 16
  mamba_ratio: 2.0
  fft_cutoff: 0.12
  kan_backend: pykan
  kan_grid: 3
  kan_order: 3
  kan_pool_size: 12
  attention_heads: 4
  attention_window: 8
  use_output_residual: false
  output_residual_scale: 0.25

dataset:
  type: msrs
  root: data/MSRS_train
  source_a: vi
  source_b: ir
  color_from: a
  crop_size: 256
  val_ratio: 0.1
  augment: true

loss:
  coeff_int: 1.0
  coeff_grad: 1.0
  weight_vis: 0.5
  weight_ir: 0.5

train:
  device: cuda
  epochs: 50
  batch_size: 4
  val_batch_size: 1
  gradient_accumulation: 8
  num_workers: 8
  lr: 0.0001
  weight_decay: 0.0
  amp: true
  grad_clip: 1.0
  log_interval: 20
  max_val_batches: 32
  reset_best_on_resume: false
  output_dir: outputs/msrs_official

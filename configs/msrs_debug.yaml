name: kmmf_msrs_debug
seed: 42

model:
  in_channels: 1
  base_channels: 8
  encoder_depths: [1, 1]
  decoder_depth: 1
  mamba_backend: lite
  mamba_d_state: 8
  mamba_ratio: 1.5
  fft_cutoff: 0.15
  kan_backend: rbf
  kan_grid: 3
  kan_order: 3
  kan_pool_size: 4
  attention_heads: 2
  attention_window: 4
  use_output_residual: false
  output_residual_scale: 0.25

dataset:
  type: msrs
  root: data/MSRS_train
  source_a: vi
  source_b: ir
  color_from: a
  crop_size: 64
  val_ratio: 0.02
  augment: false

loss:
  coeff_int: 1.0
  coeff_grad: 1.0
  weight_vis: 0.5
  weight_ir: 0.5

train:
  device: cuda
  epochs: 3
  batch_size: 1
  val_batch_size: 1
  gradient_accumulation: 1
  num_workers: 0
  lr: 0.0001
  weight_decay: 0.0
  amp: true
  grad_clip: 1.0
  log_interval: 1
  max_val_batches: 2
  reset_best_on_resume: false
  output_dir: outputs/msrs_debug

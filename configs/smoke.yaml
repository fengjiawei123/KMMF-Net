  kan_grid: 3
  kan_order: 3
  kan_pool_size: 4
  attention_heads: 2
  attention_window: 4
  use_output_residual: false
  output_residual_scale: 0.25

loss:
  coeff_int: 1.0
  coeff_grad: 1.0
  weight_vis: 0.5
  weight_ir: 0.5

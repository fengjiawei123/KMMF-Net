name: kmmf_smoke
seed: 42

model:
  in_channels: 1
  base_channels: 8
  encoder_depths: [1, 1]
  decoder_depth: 1
  mamba_backend: lite
  mamba_d_state: 8
  mamba_ratio: 1.5
  fft_cutoff: 0.15

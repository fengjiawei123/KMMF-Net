name: kmmf_medical
seed: 42

model:
  in_channels: 1
  base_channels: 24
  encoder_depths: [1, 2]
  decoder_depth: 2
  mamba_backend: official
  mamba_d_state: 16
  mamba_ratio: 2.0
  fft_cutoff: 0.12
  kan_backend: pykan
  kan_grid: 3
  kan_order: 3
  kan_pool_size: 12
  attention_heads: 4
  attention_window: 8
  use_output_residual: false
  output_residual_scale: 0.25

dataset:
  type: medical
  root: data/medical/Train
  medical_sets:
    - name: ct_mri
      source_a: CT_MRI/MRI
      source_b: CT_MRI/CT
      color_from: a
    - name: mri_pet_150
      source_a: MRI_PET_150/mri_part
      source_b: MRI_PET_150/pet_part
      color_from: b
    - name: pet_mri_1614
      source_a: PET_MRI_1614/MRI
      source_b: PET_MRI_1614/PET
      color_from: b
  crop_size: 256
  val_ratio: 0.1
  augment: true

loss:
  coeff_int: 1.0
  coeff_grad: 1.0
  weight_vis: 0.5
  weight_ir: 0.5

train:
  device: cuda
  epochs: 50
  batch_size: 4
  val_batch_size: 1
  gradient_accumulation: 8
  num_workers: 8
  lr: 0.0001
  weight_decay: 0.0
  amp: true
  grad_clip: 1.0
  log_interval: 20
  max_val_batches: 32
  reset_best_on_resume: false
  output_dir: outputs/medical
